# Configures automatic reviews once CodeRabbit is installed and authorized.
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR
reviews:
  profile: chill
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!data/**"
    - "!**/*.wav"
    - "!**/*.mp3"
    - "!**/*.m4a"
    - "!**/*.flac"
    - "!**/*.pt"
    - "!**/*.pth"
chat:
  auto_reply: false
