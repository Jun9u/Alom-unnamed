[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "data", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests", "ai/tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
